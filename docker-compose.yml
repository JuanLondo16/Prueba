name: abacus-api
services:

  # ── Gateway (Nginx) ────────────────────────────────────────────────────────
  gateway:
    image: nginx:alpine
    container_name: abacus_gateway
    ports:
      - "8000:80"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./services/gateway/docs.html:/usr/share/nginx/html/docs.html:ro
    depends_on:
      - xml-processor
      - rag-service
      - llm-service
      - session-proxy
      - odoo-service
      - siigo-service
      - integration-config-service
      - auth-service
    networks:
      - abacus-network
    #restart: unless-stopped

  # ── Auth Service (JWT RS256, Tenants, Usuarios) ───────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: abacus_auth_service
    ports:
      - "8008:8008"
    volumes:
      - ./services/auth-service/app:/app/app
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_NAME=abacus_meta
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - APP_BASE_DOMAIN=${APP_BASE_DOMAIN:-app.abacusplus.com}
      - XML_PROCESSOR_URL=http://xml-processor:8001
      - RAG_SERVICE_URL=http://rag-service:8002
      - LLM_SERVICE_URL=http://llm-service:8003
      - ODOO_SERVICE_URL=http://odoo-service:8005
      - SIIGO_SERVICE_URL=http://siigo-service:8006
      - INTEGRATION_CONFIG_URL=http://integration-config-service:8007
      - REDIS_URL=redis://redis:6379
    command: uvicorn app.main:app --host 0.0.0.0 --port 8008 --reload
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - abacus-network
    #restart: unless-stopped

  # ── Microservicio 1: Procesamiento XML/ZIP ─────────────────────────────────
  xml-processor:
    build:
      context: ./services/xml-processor
      dockerfile: Dockerfile
    container_name: abacus_xml_processor
    ports:
      - "8001:8001"
    volumes:
      - ./services/xml-processor/app:/app/app
      - ./services/xml-processor/tests:/app/tests
      - ./downloads:/app/downloads
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - RAG_SERVICE_URL=http://rag-service:8002
      - LLM_SERVICE_URL=http://llm-service:8003
      - DOWNLOADS_DIR=/app/downloads
      - REDIS_URL=redis://redis:6379
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      # RF-05 — Cola de contabilización en SIIGO.
      #
      # Los valores por defecto son los mismos que trae el código; se declaran aquí para
      # poder ajustarlos desde `.env` sin reconstruir la imagen, que es lo que hace falta
      # durante una prueba controlada contra SIIGO.
      #
      # ACCOUNTING_MAX_CONCURRENCY: peticiones simultáneas a SIIGO. **Dejar en 1** hasta
      #   medir qué tolera: SIIGO documenta su límite por minuto, pero NO documenta ningún
      #   límite de concurrencia, y en /v1/purchases —sin Idempotency-Key— una respuesta
      #   ambigua es un duplicado en potencia.
      # ACCOUNTING_RATE_LIMIT_PER_MINUTE: 100 en producción, **10 en empresa de prueba**.
      - ACCOUNTING_MAX_CONCURRENCY=${ACCOUNTING_MAX_CONCURRENCY:-1}
      - ACCOUNTING_RATE_LIMIT_PER_MINUTE=${ACCOUNTING_RATE_LIMIT_PER_MINUTE:-100}
      - ACCOUNTING_MAX_ATTEMPTS=${ACCOUNTING_MAX_ATTEMPTS:-5}
      - ACCOUNTING_SIIGO_TIMEOUT_SECONDS=${ACCOUNTING_SIIGO_TIMEOUT_SECONDS:-120}
      - ACCOUNTING_POLL_INTERVAL_SECONDS=${ACCOUNTING_POLL_INTERVAL_SECONDS:-5}
      - ACCOUNTING_BATCH_MAX_SIZE=${ACCOUNTING_BATCH_MAX_SIZE:-200}
      # RF-03 — Almacenamiento S3 (por defecto MinIO local; en prod, credenciales AWS reales
      # o el endpoint del Lambda del cliente vía S3_UPLOAD_API_URL).
      - S3_BUCKET=${S3_BUCKET:-abacus-documents}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_PUBLIC_ENDPOINT_URL=${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9100}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-abacus}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-abacus-minio-secret}
      - S3_PRESIGN_EXPIRE=${S3_PRESIGN_EXPIRE:-604800}
      # Alternativa: consumir el Lambda del cliente (si se define, tiene prioridad).
      - S3_UPLOAD_API_URL=${S3_UPLOAD_API_URL:-}
      - S3_UPLOAD_API_KEY=${S3_UPLOAD_API_KEY:-}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload --reload-dir /app/app
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - abacus-network
    #restart: unless-stopped

  # ── Microservicio 2: RAG (embeddings + búsqueda vectorial) ─────────────────
  rag-service:
    build:
      context: ./services/rag-service
      dockerfile: Dockerfile
    container_name: abacus_rag_service
    ports:
      - "8002:8002"
    volumes:
      - ./services/rag-service/app:/app/app
      - ./services/rag-service/tests:/app/tests
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    depends_on:
      database:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - abacus-network
    #restart: unless-stopped

  # ── Microservicio 3: LLM Orchestration (OpenAI + RAG) ─────────────────────
  llm-service:
    build:
      context: ./services/llm-service
      dockerfile: Dockerfile
    container_name: abacus_llm_service
    ports:
      - "8003:8003"
    volumes:
      - ./services/llm-service/app:/app/app
      - ./services/llm-service/tests:/app/tests
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - RAG_SERVICE_URL=http://rag-service:8002
      - XML_PROCESSOR_URL=http://xml-processor:8001
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload
    depends_on:
      database:
        condition: service_healthy
      rag-service:
        condition: service_started
    networks:
      - abacus-network
    #restart: unless-stopped

  # ── Microservicio 4: Session Proxy (portal externo con cookies) ───────────
  session-proxy:
    build:
      context: ./services/session-proxy
      dockerfile: Dockerfile
    container_name: abacus_session_proxy
    ports:
      - "8004:8004"
    volumes:
      - ./services/session-proxy/app:/app/app
      - ./services/session-proxy/tests:/app/tests
      - ./downloads:/app/downloads
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - EXTERNAL_BASE_URL=${EXTERNAL_BASE_URL:-https://portal.example.com}
      - EXTERNAL_LOGIN_PATH=${EXTERNAL_LOGIN_PATH:-/api/login}
      - EXTERNAL_FIXED_PK=${EXTERNAL_FIXED_PK:-}
      - EXTERNAL_FIXED_RK=${EXTERNAL_FIXED_RK:-}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-3600}
      - REPRESENTATIVE=${REPRESENTATIVE:-}
      - NIT=${NIT:-}
      - BROWSER_TIMEOUT_MS=${BROWSER_TIMEOUT_MS:-60000}
      - REDIS_URL=redis://redis:6379
      - DOWNLOADS_DIR=/app/downloads
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8004 --reload --reload-dir /app/app
    depends_on:
      - redis
    networks:
      - abacus-network
    #restart: unless-stopped

  session-proxy-worker:
    build:
      context: ./services/session-proxy
      dockerfile: Dockerfile
    container_name: abacus_session_proxy_worker
    # Display virtual Xvfb para correr Chromium headful (headless=False), lo que reduce
    # drásticamente la detección de Cloudflare Turnstile. Restart-safe: limpia lock viejo
    # y espera a que Xvfb quede listo antes de arrancar el worker.
    command: >
      sh -c "rm -f /tmp/.X99-lock /tmp/.X11-unix/X99;
      Xvfb :99 -screen 0 1280x720x24 -nolisten tcp -ac >/tmp/xvfb.log 2>&1 &
      export DISPLAY=:99;
      for i in $$(seq 1 40); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.25; done;
      exec python -m arq app.infrastructure.workers.download_worker.WorkerSettings"
    volumes:
      - ./services/session-proxy/app:/app/app
      - ./downloads:/app/downloads
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - EXTERNAL_BASE_URL=${EXTERNAL_BASE_URL:-https://catalogo-vpfe.dian.gov.co}
      - EXTERNAL_LOGIN_PATH=${EXTERNAL_LOGIN_PATH:-/User/AuthToken}
      - EXTERNAL_FIXED_PK=${EXTERNAL_FIXED_PK:-}
      - EXTERNAL_FIXED_RK=${EXTERNAL_FIXED_RK:-}
      - REDIS_URL=redis://redis:6379
      - DOWNLOADS_DIR=/app/downloads
      - XML_PROCESSOR_URL=http://xml-processor:8001
      - BROWSER_HEADLESS=false
      - BROWSER_PROFILE_DIR=/app/downloads/.pw-profile
      - BROWSER_CHANNEL=${BROWSER_CHANNEL:-chrome}
      - CAPSOLVER_API_KEY=${CAPSOLVER_API_KEY:-}
      - TURNSTILE_SITEKEY=${TURNSTILE_SITEKEY:-0x4AAAAAAAg1WuNb-OnOa76z}
    depends_on:
      - redis
      - xml-processor
    networks:
      - abacus-network
    #restart: unless-stopped

  # ── Microservicio 5: Odoo (asientos contables de compra) ──────────────────
  odoo-service:
    build:
      context: ./services/odoo-service
      dockerfile: Dockerfile
    container_name: abacus_odoo_service
    ports:
      - "8005:8005"
    volumes:
      - ./services/odoo-service/app:/app/app
      - ./services/odoo-service/tests:/app/tests
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - ODOO_URL=${ODOO_URL:-http://localhost:8069}
      - ODOO_DB=${ODOO_DB:-odoo}
      - ODOO_USER=${ODOO_USER:-admin}
      - ODOO_PASSWORD=${ODOO_PASSWORD:-admin}
      - RAG_SERVICE_URL=http://rag-service:8002
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8005 --reload --timeout-keep-alive 1200
    depends_on:
      database:
        condition: service_healthy
      rag-service:
        condition: service_started
    networks:
      - abacus-network
    #restart: unless-stopped

  # ── Microservicio 6: SIIGO (credenciales, plan de cuentas y compras) ─────
  siigo-service:
    build:
      context: ./services/siigo-service
      dockerfile: Dockerfile
    container_name: abacus_siigo_service
    ports:
      - "8006:8006"
    volumes:
      - ./services/siigo-service/app:/app/app
      - ./services/siigo-service/tests:/app/tests
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - SIIGO_BASE_URL=${SIIGO_BASE_URL:-https://api.siigo.com}
      - SIIGO_CHART_ACCOUNTS_PATH=${SIIGO_CHART_ACCOUNTS_PATH:-/v1/accounts}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8006 --reload
    depends_on:
      database:
        condition: service_healthy
    networks:
      - abacus-network
    #restart: unless-stopped

  # ── Microservicio 7: Configuracion de integraciones externas ─────────────
  integration-config-service:
    build:
      context: ./services/integration-config-service
      dockerfile: Dockerfile
    container_name: abacus_integration_config_service
    ports:
      - "8007:8007"
    volumes:
      - ./services/integration-config-service/app:/app/app
      - ./services/integration-config-service/tests:/app/tests
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      # Proyección del catálogo sincronizado sobre `cost_centers` (propiedad de xml-processor)
      - XML_PROCESSOR_URL=http://xml-processor:8001
    command: uvicorn app.main:app --host 0.0.0.0 --port 8007 --reload
    depends_on:
      database:
        condition: service_healthy
    networks:
      - abacus-network
    #restart: unless-stopped

  # ── Infraestructura ────────────────────────────────────────────────────────
  database:
    image: pgvector/pgvector:pg16
    container_name: abacus_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    environment:
      - POSTGRES_USER=${DATABASE_USER:-master}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-master}
      - POSTGRES_DB=${DATABASE_NAME:-xml2data}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-master} -d ${DATABASE_NAME:-xml2data}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - abacus-network
    #restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: abacus_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - abacus-network
    #restart: unless-stopped

  ollama-init:
    image: ollama/ollama
    container_name: abacus_ollama_init
    depends_on:
      - ollama
    entrypoint: >
      /bin/sh -c "sleep 10 && OLLAMA_HOST=http://ollama:11434 ollama pull nomic-embed-text"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - abacus-network
    #restart: on-failure

  redis:
    image: redis:alpine
    container_name: abacus_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - abacus-network

  # ── Almacenamiento de objetos S3 (RF-03) — MinIO, compatible con Amazon S3 ──
  minio:
    image: minio/minio:latest
    container_name: abacus_minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-abacus}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-abacus-minio-secret}
    ports:
      - "9100:9000"   # API S3 (host → contenedor)
      - "9101:9001"   # Consola web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - abacus-network

  # Crea el bucket privado una vez que MinIO está listo.
  minio-init:
    image: minio/mc:latest
    container_name: abacus_minio_init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set abacus http://minio:9000 ${S3_ACCESS_KEY:-abacus} ${S3_SECRET_KEY:-abacus-minio-secret}; do sleep 2; done;
      mc mb --ignore-existing abacus/${S3_BUCKET:-abacus-documents};
      mc anonymous set none abacus/${S3_BUCKET:-abacus-documents};
      echo 'Bucket listo (privado)';
      "
    networks:
      - abacus-network

  # Deja el proyecto usable justo despues de levantarlo, sin restaurar ningun respaldo a
  # mano: crea (si no existe) un tenant de demostracion con credenciales conocidas. Usa el
  # mismo endpoint de bootstrap con el que se registra un cliente real
  # (POST /api/v1/tenants) — crea la base `abacus_t_{slug}`, provisiona cada microservicio
  # y el primer usuario administrador en una sola llamada. Idempotente: si el tenant ya
  # existe, el endpoint responde 400 y el script lo trata como exito, asi que correr esto
  # de nuevo (o en un volumen que ya tenia el tenant) no falla ni duplica nada.
  #
  # SOLO PARA DESARROLLO. `profiles: [dev]` es lo que evita que esto arranque solo: un
  # `docker compose up` normal (el que se usaria en un servidor real) lo ignora por
  # completo. Un tenant con contrasena conocida creandose solo en cualquier ambiente donde
  # se levante el stack seria una puerta trasera real en produccion. Activarlo a proposito:
  #   docker compose --profile dev up demo-tenant-init
  # (o agregar COMPOSE_PROFILES=dev al .env local, nunca al de un servidor compartido).
  demo-tenant-init:
    image: curlimages/curl:latest
    container_name: abacus_demo_tenant_init
    profiles: ["dev"]
    depends_on:
      - gateway
    entrypoint:
      - /bin/sh
      - -c
      - |
        i=0
        while [ $$i -lt 60 ]; do
          CODE=$$(curl -s -o /tmp/resp -w '%{http_code}' -X POST http://gateway/api/v1/tenants -H "X-Internal-Secret: ${INTERNAL_SECRET}" -H 'Content-Type: application/json' -d '{"slug":"${DEMO_TENANT_SLUG:-ikbo}","display_name":"${DEMO_TENANT_NAME:-IKBO SAS}","email_domain":"${DEMO_TENANT_EMAIL_DOMAIN:-ikbo.co}","admin_email":"${DEMO_TENANT_ADMIN_EMAIL:-admin@ikbo.co}","admin_password":"${DEMO_TENANT_ADMIN_PASSWORD:-Secure123!}"}' 2>/dev/null)
          if [ "$$CODE" = "201" ]; then echo "Tenant demo creado."; exit 0; fi
          if [ "$$CODE" = "400" ]; then echo "Tenant demo ya existia, nada que hacer."; exit 0; fi
          i=$$((i+1))
          sleep 2
        done
        echo "No se pudo crear el tenant demo tras varios intentos (ultimo HTTP $$CODE):"
        cat /tmp/resp 2>/dev/null
        exit 1
    networks:
      - abacus-network

  # Restaura automaticamente, al arrancar, cualquier backup que alguien haya dejado en
  # ./backups/ (ver scripts/restore-backups.sh para la convencion de archivos) — sin que
  # nadie tenga que correr `docker cp`/`psql -f`/`pg_restore` a mano. Es la forma normal de
  # dejar un clon nuevo con los tenants y documentos DIAN ya procesados, sin pasar por
  # demo-tenant-init (que crea un tenant vacio con contrasena conocida, no datos reales).
  #
  # Sin `profiles`, a proposito: corre siempre con un `docker compose up` normal. No es un
  # riesgo de seguridad como demo-tenant-init porque es pasivo — si ./backups/ no tiene
  # ningun .dump (cualquier ambiente real, sin esa carpeta), no hace absolutamente nada.
  #
  # Idempotente: si `abacus_t_<slug>` ya existe (segunda vez que se levanta el stack, con
  # datos nuevos generados desde la primera restauracion), esa base se deja intacta.
  backup-restore:
    image: pgvector/pgvector:pg16
    container_name: abacus_backup_restore
    env_file: .env
    volumes:
      - ./backups:/backups:ro
      - ./scripts/restore-backups.sh:/restore-backups.sh:ro
    entrypoint: ["/bin/sh", "/restore-backups.sh"]
    depends_on:
      database:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - abacus-network

networks:
  abacus-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
  redis_data:
  minio_data:
