name: 03 - PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  size-label:
    name: PR size
    runs-on: ubuntu-latest
    steps:
      - uses: pascalgn/size-label-action@v0.5.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          sizes: >
            {"0": "XS", "20": "S", "100": "M", "400": "L", "1000": "XL"}

  size-warn:
    name: PR size warning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Avisar si el PR cambia más de 400 líneas
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          LINES=$(git diff --shortstat $BASE..$HEAD | awk '{print $4+$6}')
          echo "Líneas cambiadas: $LINES"
          if [ "$LINES" -gt 400 ]; then
            echo "::warning::El PR cambia $LINES líneas (más de 400). Considera dividirlo en partes más pequeñas."
          fi

  coverage-gate:
    name: coverage-gate
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: ./coverage
      - run: pip install coverage==7.6.1
      - name: Verificar que la cobertura no bajó más del 10%
        run: python scripts/check_coverage_against_baseline.py
